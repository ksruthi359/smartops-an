<div class="navbar">

  <!-- Left side -->
  <div class="navbar-left">

    <button class="menu-button">
      ☰
    </button>

    <span class="page-title">
      SmartOps Hub
    </span>

  </div>


  <!-- Right side -->
  <div class="navbar-right">

    <!-- Notification -->
    <div class="notification">
      🔔
      @if (notificationService.unreadCount$ | async; as unreadCount) {
  <span class="notification-count">{{ unreadCount }}</span>
}
    </div>


    <!-- User avatar -->
    <div class="avatar">
      S
    </div>


    <!-- Username -->
    <div class="user-info">
      <span class="username">
        super_admin
      </span>

      <span class="role">
        Super_admin
      </span>
    </div>


    <!-- Logout -->
<button
  type="button"
  class="logout"
  aria-label="Log out"
  (click)="logout()"
  [disabled]="loggingOut">
  <span class="logout-icon" aria-hidden="true"></span>
</button>

@if (logoutError) {
  <p role="alert">{{ logoutError }}</p>
}

  </div>

</div>
